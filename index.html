<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Christian Beltran | Interactive Pricing Component</title>

  <link rel="stylesheet" href="./assets/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
</head>
<body>

  <main>
    <div class="container">
      <h1 class="title">Simple, traffic-based pricing</h1>
      <p>Sign-up for our 30-day trial. No credit card required. </p>
      <section class="card">
        <h2 class="card--title"><span>100K</span> PAGEVIEWS</h2>
        <form action="">
          <input type="range" name="price" id="priceRange" min="0" max="100" value="50">
        </form>

        <div class="price">
          $<span>16.00</span>/ month
        </div>
      </section>
    </div>
  </main>
  <script src="./assets/app.js"></script>
</body>
</html>
